name: Release

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub Release.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of the release .jks
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias
#   RELEASE_KEY_PASSWORD     key password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not set; refusing to publish an unsigned build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk "out/PadKeys-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties
